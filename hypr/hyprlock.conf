# ┌─────────────────────────────────────────────┐
# │  hyprlock · Nord                            │
# └─────────────────────────────────────────────┘
#
# Nord palette (https://www.nordtheme.com)
#   Polar Night  nord0 2E3440  nord1 3B4252  nord2 434C5E  nord3 4C566A
#   Snow Storm   nord4 D8DEE9  nord5 E5E9F0  nord6 ECEFF4
#   Frost        nord7 8FBCBB  nord8 88C0D0  nord9 81A1C1  nord10 5E81AC
#   Aurora       nord11 BF616A nord12 D08770 nord13 EBCB8B nord14 A3BE8C nord15 B48EAD
#
# Note: a literal "#" inside a value must be written as "##".
# Previous config saved as hyprlock.conf.bak

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldColors, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── Background ───────────────────────────────────
background {
    monitor =
    path = ~/.config/Wallpapers/wallpaper.png
    color = rgb(2E3440)            # nord0 fallback
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.12
    noise = 0.012
}

# ── Clock ────────────────────────────────────────
label {
    monitor =
    text = <span font_weight="200">$TIME</span>
    color = rgb(ECEFF4)            # nord6
    font_size = 110
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(2E344080)

    position = 0, 170
    halign = center
    valign = center
}

# ── Date ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='3072'>$(date +'%A, %d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgb(88C0D0)            # nord8
    font_size = 13
    font_family = $font

    position = 0, 65
    halign = center
    valign = center
}

# ── Password ─────────────────────────────────────
input-field {
    monitor =
    size = 300, 52
    rounding = -1                  # pill
    outline_thickness = 2

    inner_color = rgba(2E3440B3)   # nord0 @ 70%
    outer_color = rgba(4C566ACC)   # nord3
    font_color = rgb(ECEFF4)       # nord6
    check_color = rgb(81A1C1)      # nord9  – authenticating
    fail_color = rgb(BF616A)       # nord11 – wrong password
    capslock_color = rgb(EBCB8B)   # nord13 – caps lock on

    font_family = $font
    placeholder_text = <span foreground="##D8DEE999">󰌾  $USER</span>
    fail_text = <span foreground="##BF616A">$FAIL</span>
    fade_on_empty = false

    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(2E344066)

    position = 0, -60
    halign = center
    valign = center
}

# ── Battery (bottom right) ───────────────────────
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/hyprlock-battery.sh
    color = rgb(D8DEE9)            # nord4
    font_size = 12
    font_family = $font

    position = -32, 28
    halign = right
    valign = bottom
}

# ── Host (bottom left) ───────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "󰌢  $(uname -n)"
    color = rgba(D8DEE999)         # nord4 @ 60%
    font_size = 12
    font_family = $font

    position = 32, 28
    halign = left
    valign = bottom
}
